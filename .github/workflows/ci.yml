name: CI

on:
  pull_request:
  push:
    branches: [master, develop]

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: clinicalstudy
          POSTGRES_USER: clinical
          POSTGRES_PASSWORD: clinical
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U clinical -d clinicalstudy"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Mesmas credenciais do docker-compose.yml (banco criado com clinical/clinical)
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/clinicalstudy
      SPRING_DATASOURCE_USERNAME: clinical
      SPRING_DATASOURCE_PASSWORD: clinical

    defaults:
      run:
        working-directory: backend/clinicalstudypb-api

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Permitir execução do Maven Wrapper
        run: chmod +x mvnw

      - name: Build e testes (JUnit + JaCoCo)
        run: ./mvnw -B verify

      - name: Publicar relatório de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-jacoco
          path: backend/clinicalstudypb-api/target/site/jacoco

  frontend:
    name: Frontend (build + testes)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend/frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Build
        run: npm run build

      - name: Testes com cobertura (Vitest)
        run: npm run test:coverage

      - name: Publicar relatório de cobertura (Vitest)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-vitest
          path: frontend/frontend/coverage

  mobile:
    name: Mobile (testes)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test
