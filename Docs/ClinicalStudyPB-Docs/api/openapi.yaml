  /candidatos/{candidatoId}/inclusao:
    post:
      tags: [Inclusão]
      summary: Inclui um candidato elegível no estudo (RF11)
      description: |
        Perfil permitido: COORDENADOR.
        O estudo deve estar em RECRUTAMENTO e possuir vaga disponível; o candidato deve estar elegível
        e ter consentimento registrado.
        Na mesma operação, o sistema cria a conta PARTICIPANTE com o e-mail do candidato e devolve a senha
        provisória em `conta.senhaProvisoria` (task 3751). Se já existe conta de participante com esse e-mail
        (pessoa incluída antes em outro estudo), ela é reaproveitada e a senha não muda.
        Se o e-mail pertence a um usuário da equipe, a inclusão é recusada com 409 `EMAIL_DE_OUTRO_PERFIL`.
      parameters:
        - name: candidatoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
