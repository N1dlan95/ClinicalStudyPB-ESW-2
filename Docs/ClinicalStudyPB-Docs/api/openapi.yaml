openapi: 3.0.3

info:
  title: ClinicalStudyPB API
  version: 0.1.0
  description: |
    Contrato da API REST do ClinicalStudyPB, compartilhada pela aplicação web e pelo aplicativo mobile.

    **Escopo desta versão (Sprint 1):** RF01 a RF04 (usuários, autenticação, autorização por perfil e cadastro de estudos).
    As demais rotas entram nas próximas sprints.

    **Pontos ainda em aberto (a decidir pela equipe):**
    - Prefixo `/api` (está no campo `servers`; mudar em um único lugar).
    - Autenticação por JWT ou por sessão (o contrato usa Bearer JWT; trocar o `securitySchemes` se for sessão).
    - Um usuário tem um único perfil (campo `perfil`); se a equipe decidir por vários, vira uma lista.

    Todos os dados são fictícios.

servers:
  - url: http://localhost:8080/api
    description: Desenvolvimento local

tags:
  - name: Autenticação
    description: Login, logout e dados do usuário logado (RF02, RF03)
  - name: Usuários
    description: Cadastro e gestão de usuários (RF01). Somente administrador.
  - name: Perfis
    description: Perfis de acesso e suas permissões (RF03)
  - name: Estudos
    description: Cadastro de estudos (RF04)
  - name: Critérios
    description: Critérios de elegibilidade dos estudos (RF05)
  - name: Candidatos
    description: Candidatos vinculados aos estudos (RF08)
  - name: Avaliação de elegibilidade
    description: Avaliação dos critérios de elegibilidade dos candidatos (RF09)
  - name: Consentimento
    description: Registro do consentimento simulado dos candidatos (RF10)
  - name: Inclusão
    description: Inclusão de candidatos nos estudos (RF11)

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica o usuário (RF02)
      description: Público. Retorna o token e os dados do usuário. Usuário inativo não consegue entrar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          description: E-mail ou senha incorretos, ou usuário inativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão (RF02)
      description: |
        Qualquer perfil autenticado. Com JWT, o encerramento principal é o cliente descartar o token;
        o backend pode invalidá-lo (lista de tokens revogados) se a equipe decidir.
      responses:
        "204":
          description: Sessão encerrada
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Dados do usuário logado e suas permissões (RF03)
      description: Qualquer perfil autenticado. A web e o mobile usam para decidir o que exibir.
      responses:
        "200":
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioLogado"
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários (RF01)
      description: "Perfil permitido: ADMINISTRADOR."
      parameters:
        - name: perfil
          in: query
          schema:
            $ref: "#/components/schemas/PerfilTipo"
        - name: ativo
          in: query
          schema:
            type: boolean
        - name: busca
          in: query
          description: Texto a procurar no nome ou no e-mail
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaUsuarios"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
    post:
      tags: [Usuários]
      summary: Cadastra um usuário (RF01)
      description: "Perfil permitido: ADMINISTRADOR. O e-mail deve ser único."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCriacao"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "409":
          $ref: "#/components/responses/Conflito"

  /usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Usuários]
      summary: Busca um usuário (RF01)
      description: "Perfil permitido: ADMINISTRADOR."
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Usuários]
      summary: Atualiza os dados de um usuário (RF01)
      description: |
        Perfil permitido: ADMINISTRADOR. Não altera senha nem situação (ativo);
        para isso há rotas próprias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioAtualizacao"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /usuarios/{id}/status:
    patch:
      tags: [Usuários]
      summary: Ativa ou desativa um usuário (RF01)
      description: "Perfil permitido: ADMINISTRADOR. Usuário desativado não faz login."
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo:
                  type: boolean
      responses:
        "200":
          description: Situação atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /perfis:
    get:
      tags: [Perfis]
      summary: Lista os perfis e suas permissões (RF03)
      description: "Perfil permitido: ADMINISTRADOR. Usado para preencher a escolha de perfil no cadastro de usuário."
      responses:
        "200":
          description: Perfis disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerfilDetalhe"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"

  /estudos:
    get:
      tags: [Estudos]
      summary: Lista estudos (RF04)
      description: |
        Perfis permitidos: PESQUISADOR, COORDENADOR, ADMINISTRADOR.
        O participante consulta seus estudos por uma rota própria do app (RF17, próxima sprint).
      parameters:
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/EstadoEstudo"
        - name: busca
          in: query
          description: Texto a procurar no título
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de estudos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaEstudos"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
    post:
      tags: [Estudos]
      summary: Cadastra um estudo (RF04)
      description: |
        Perfil permitido: PESQUISADOR.
        O estudo nasce no estado PLANEJAMENTO. O responsável deve ser um usuário ativo com perfil PESQUISADOR.
        A data de término não pode ser anterior à de início.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstudoEntrada"
      responses:
        "201":
          description: Estudo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"

  /estudos/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Estudos]
      summary: Busca um estudo (RF04)
      description: "Perfis permitidos: PESQUISADOR, COORDENADOR, ADMINISTRADOR."
      responses:
        "200":
          description: Estudo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Estudos]
      summary: Atualiza os dados de um estudo (RF04)
      description: |
        Perfil permitido: PESQUISADOR. Não altera o estado do estudo (a rota de mudança de estado
        entra com o RF07). Estudo ENCERRADO não pode ser editado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstudoEntrada"
      responses:
        "200":
          description: Estudo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/estado:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Estudos]
      summary: Altera o estado do estudo (RF07)
      description: |
        Perfil permitido: PESQUISADOR.
        Transições válidas: PLANEJAMENTO → RECRUTAMENTO;
        RECRUTAMENTO → PLANEJAMENTO ou EXECUCAO;
        EXECUCAO → ENCERRADO. ENCERRADO não possui transição de saída.
        Permanecer no mesmo estado é inválido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstudoEstadoEntrada"
      responses:
        "200":
          description: Estado alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Transição inválida ou estado final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /estudos/{id}/visitas-previstas:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Visitas previstas]
      summary: Lista visitas previstas e atividades de um estudo (RF06)
      description: Perfil permitido PESQUISADOR.
      responses:
        "200":
          description: Visitas previstas do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitaPrevista"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      tags: [Visitas previstas]
      summary: Cadastra uma visita prevista (RF06)
      description: Perfil permitido PESQUISADOR. A ordem da visita é única no estudo e a ordem das atividades é única na visita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitaPrevistaEntrada"
      responses:
        "201":
          description: Visita prevista criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitaPrevista"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/visitas-previstas/{visitaId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: visitaId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Visitas previstas]
      summary: Atualiza uma visita prevista e substitui suas atividades (RF06)
      description: Perfil permitido PESQUISADOR.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitaPrevistaEntrada"
      responses:
        "200":
          description: Visita prevista atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitaPrevista"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
    delete:
      tags: [Visitas previstas]
      summary: Exclui uma visita prevista (RF06)
      description: Perfil permitido PESQUISADOR. As atividades são excluídas em cascata.
      responses:
        "204":
          description: Visita prevista excluída
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/criterios:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Critérios]
      summary: Lista os critérios de um estudo (RF05)
      description: "Perfis permitidos: PESQUISADOR, COORDENADOR, ADMINISTRADOR."
      responses:
        "200":
          description: Critérios do estudo, ordenados por tipo e ordem
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Criterio"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      tags: [Critérios]
      summary: Cadastra um critério de elegibilidade (RF05)
      description: |
        Perfil permitido: PESQUISADOR.
        O estudo deve estar em PLANEJAMENTO. A ordem pode ser informada ou é calculada automaticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterioEntrada"
      responses:
        "201":
          description: Critério criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Criterio"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/criterios/{criterioId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: criterioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Critérios]
      summary: Atualiza um critério de elegibilidade (RF05)
      description: Perfil permitido PESQUISADOR. O estudo deve estar em PLANEJAMENTO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterioEntrada"
      responses:
        "200":
          description: Critério atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Criterio"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
    delete:
      tags: [Critérios]
      summary: Remove um critério de elegibilidade (RF05)
      description: |
        Perfil permitido PESQUISADOR.
        O estudo deve estar em PLANEJAMENTO e o critério não pode ter sido usado em avaliações.
      responses:
        "204":
          description: Critério removido
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/candidatos:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Candidatos]
      summary: Lista candidatos de um estudo (RF08)
      description: "Perfil permitido: COORDENADOR."
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/StatusCandidato"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de candidatos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaCandidatos"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      tags: [Candidatos]
      summary: Cadastra um candidato no estudo (RF08)
      description: |
        Perfil permitido: COORDENADOR.
        O estudo deve estar em RECRUTAMENTO. O candidato nasce com status CADASTRADO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidatoEntrada"
      responses:
        "201":
          description: Candidato criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidato"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/candidatos/{candidatoId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: candidatoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Candidatos]
      summary: Busca um candidato de um estudo (RF08)
      description: "Perfil permitido: COORDENADOR."
      responses:
        "200":
          description: Candidato encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidato"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Candidatos]
      summary: Atualiza os dados de um candidato (RF08)
      description: |
        Perfil permitido: COORDENADOR.
        Estudo ENCERRADO não pode receber alterações. O status do candidato não é alterado nesta operação.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandidatoEntrada"
      responses:
        "200":
          description: Candidato atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidato"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /candidatos/{candidatoId}/avaliacao:
    parameters:
      - name: candidatoId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    get:
      tags: [Avaliação de elegibilidade]
      summary: Consulta a avaliação de um candidato (RF09)
      description: "Perfil permitido: COORDENADOR."
      responses:
        "200":
          description: Avaliação atual ou respostas pendentes de registro
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avaliacao"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Avaliação de elegibilidade]
      summary: Registra ou substitui a avaliação do candidato (RF09)
      description: |
        Perfil permitido: COORDENADOR.
        O estudo deve estar em RECRUTAMENTO, o candidato não pode estar incluído ou retirado,
        e o consentimento ainda não pode ter sido registrado. Todas as respostas dos critérios são substituídas.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvaliacaoEntrada"
      responses:
        "200":
          description: Avaliação registrada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Avaliacao"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /candidatos/{candidatoId}/consentimento:
    post:
      tags: [Consentimento]
      summary: Registra o consentimento simulado do candidato (RF10)
      description: |
        Perfil permitido: COORDENADOR.
        Apenas candidato elegível pode receber consentimento, uma única vez.
      parameters:
        - name: candidatoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Consentimento registrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Candidato"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /candidatos/{candidatoId}/inclusao:
    post:
      tags: [Inclusão]
      summary: Inclui um candidato elegível no estudo (RF11)
      description: |
        Perfil permitido: COORDENADOR.
        O estudo deve estar em RECRUTAMENTO e possuir vaga disponível; o candidato deve estar elegível
        e ter consentimento registrado.
      parameters:
        - name: candidatoId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: Candidato incluído
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Inclusao"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enviar o token no cabeçalho Authorization como "Bearer <token>".

  parameters:
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Número da página, começando em 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Itens por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    RequisicaoInvalida:
      description: Dados inválidos (campo obrigatório ausente, formato errado ou regra de validação)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            timestamp: "2026-10-24T18:45:00-03:00"
            status: 400
            codigo: VALIDACAO
            mensagem: Dados inválidos
            detalhes:
              - campo: dataFim
                mensagem: A data de término não pode ser anterior à data de início
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    SemPermissao:
      description: O perfil do usuário não permite esta ação
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Conflito:
      description: Conflito com uma regra de negócio (por exemplo, e-mail já cadastrado ou estudo encerrado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"

  schemas:
    AtividadeEntrada:
      type: object
      required: [ordem, descricao]
      properties:
        ordem:
          type: integer
          minimum: 1
        descricao:
          type: string
          minLength: 1
          maxLength: 500

    Atividade:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        ordem:
          type: integer
          minimum: 1
        descricao:
          type: string
          maxLength: 500

    VisitaPrevistaEntrada:
      type: object
      required: [ordem, nome, diaPrevisto]
      properties:
        ordem:
          type: integer
          minimum: 1
        nome:
          type: string
          minLength: 3
          maxLength: 120
        diaPrevisto:
          type: integer
          minimum: 0
        janelaDias:
          type: integer
          minimum: 0
          nullable: true
        descricao:
          type: string
          maxLength: 500
          nullable: true
        atividades:
          type: array
          items:
            $ref: "#/components/schemas/AtividadeEntrada"

    VisitaPrevista:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        ordem:
          type: integer
          minimum: 1
        nome:
          type: string
          maxLength: 120
        diaPrevisto:
          type: integer
          minimum: 0
        janelaDias:
          type: integer
          minimum: 0
          nullable: true
        descricao:
          type: string
          maxLength: 500
          nullable: true
        atividades:
          type: array
          items:
            $ref: "#/components/schemas/Atividade"

    TipoCriterio:
      type: string
      enum: [INCLUSAO, EXCLUSAO]

    CriterioEntrada:
      type: object
      required: [tipo, descricao]
      additionalProperties: false
      properties:
        tipo:
          $ref: "#/components/schemas/TipoCriterio"
        descricao:
          type: string
          minLength: 3
          maxLength: 500
        ordem:
          type: integer
          minimum: 1
          nullable: true
          description: Quando omitida, o critério vai para o fim da lista do tipo.

    Criterio:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        tipo:
          $ref: "#/components/schemas/TipoCriterio"
        descricao:
          type: string
          minLength: 3
          maxLength: 500
        ordem:
          type: integer
          minimum: 1

    StatusCandidato:
      type: string
      enum: [CADASTRADO, ELEGIVEL, INELEGIVEL, INCLUIDO, RETIRADO]

    CandidatoEntrada:
      type: object
      required: [nome, email, dataNascimento]
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        telefone:
          type: string
          minLength: 8
          maxLength: 20
          nullable: true
          description: Aceita dígitos, espaços, parênteses, + e -.
        dataNascimento:
          type: string
          format: date

    ConsentimentoCandidato:
      type: object
      nullable: true
      properties:
        registradoEm:
          type: string
          format: date-time
        registradoPor:
          type: string

    Candidato:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        estudoId:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
        dataNascimento:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/StatusCandidato"
        consentimento:
          $ref: "#/components/schemas/ConsentimentoCandidato"
        dataInclusao:
          type: string
          format: date
          nullable: true

    AvaliacaoRespostaEntrada:
      type: object
      required: [criterioId, atende]
      additionalProperties: false
      properties:
        criterioId:
          type: integer
          format: int64
        atende:
          type: boolean
        observacao:
          type: string
          maxLength: 500
          nullable: true

    AvaliacaoEntrada:
      type: object
      required: [respostas]
      additionalProperties: false
      properties:
        respostas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AvaliacaoRespostaEntrada"

    Avaliador:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string

    AvaliacaoItem:
      type: object
      properties:
        criterioId:
          type: integer
          format: int64
        tipo:
          $ref: "#/components/schemas/TipoCriterio"
        descricao:
          type: string
        ordem:
          type: integer
        atende:
          type: boolean
          nullable: true
        observacao:
          type: string
          nullable: true

    Avaliacao:
      type: object
      properties:
        candidatoId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/StatusCandidato"
        avaliadoEm:
          type: string
          format: date-time
          nullable: true
        avaliadoPor:
          $ref: "#/components/schemas/Avaliador"
        criterios:
          type: array
          items:
            $ref: "#/components/schemas/AvaliacaoItem"

    Inclusao:
      type: object
      required: [vagasOcupadas, limiteParticipantes]
      properties:
        vagasOcupadas:
          type: integer
          format: int64
        limiteParticipantes:
          type: integer

    PerfilTipo:
      type: string
      enum: [ADMINISTRADOR, PESQUISADOR, COORDENADOR, PARTICIPANTE]

    EstadoEstudo:
      type: string
      enum: [PLANEJAMENTO, RECRUTAMENTO, EXECUCAO, ENCERRADO]

    EstudoEstadoEntrada:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          $ref: "#/components/schemas/EstadoEstudo"

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: ana.pesquisadora@clinicalstudypb.test
        senha:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEm:
          type: string
          format: date-time
        usuario:
          $ref: "#/components/schemas/UsuarioLogado"

    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          format: email
          example: ana.pesquisadora@clinicalstudypb.test
        matricula:
          type: string
          nullable: true
        perfil:
          $ref: "#/components/schemas/PerfilTipo"
        ativo:
          type: boolean

    UsuarioLogado:
      allOf:
        - $ref: "#/components/schemas/Usuario"
        - type: object
          properties:
            permissoes:
              type: array
              items:
                type: string
              example: [ESTUDO_CRIAR, ESTUDO_CONSULTAR]

    UsuarioCriacao:
      type: object
      required: [nome, email, perfil, senha]
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
        matricula:
          type: string
          nullable: true
        perfil:
          $ref: "#/components/schemas/PerfilTipo"
        senha:
          type: string
          format: password
          minLength: 8
          writeOnly: true

    UsuarioAtualizacao:
      type: object
      required: [nome, email, perfil]
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
        matricula:
          type: string
          nullable: true
        perfil:
          $ref: "#/components/schemas/PerfilTipo"

    PerfilDetalhe:
      type: object
      properties:
        perfil:
          $ref: "#/components/schemas/PerfilTipo"
        permissoes:
          type: array
          items:
            type: string

    ResponsavelResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string

    EstudoEntrada:
      type: object
      required: [titulo, objetivo, responsavelId, dataInicio, limiteParticipantes]
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 200
        objetivo:
          type: string
          maxLength: 2000
        responsavelId:
          type: integer
          format: int64
          description: Id de um usuário ativo com perfil PESQUISADOR
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
          nullable: true
        limiteParticipantes:
          type: integer
          minimum: 1

    Estudo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        titulo:
          type: string
        objetivo:
          type: string
        responsavel:
          $ref: "#/components/schemas/ResponsavelResumo"
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
          nullable: true
        limiteParticipantes:
          type: integer
        estado:
          $ref: "#/components/schemas/EstadoEstudo"

    Pagina:
      type: object
      properties:
        number:
          type: integer
          description: Página atual (começa em 0)
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    PaginaUsuarios:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Usuario"

    PaginaEstudos:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Estudo"

    PaginaCandidatos:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Candidato"

    Erro:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        codigo:
          type: string
          description: Código curto para o front tratar (VALIDACAO, NAO_ENCONTRADO, EMAIL_DUPLICADO...)
        mensagem:
          type: string
        detalhes:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensagem:
                type: string
