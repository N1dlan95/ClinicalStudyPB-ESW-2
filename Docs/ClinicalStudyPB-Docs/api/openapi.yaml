  /candidatos/{candidatoId}/visitas:
    get:
      tags: [Visitas]
      summary: Lista as visitas do participante, por data (RF12)
      description: "Perfil permitido: COORDENADOR."
      parameters:
        - $ref: "#/components/parameters/CandidatoIdPath"
      responses:
        "200":
          description: Visitas do participante
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visita"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      tags: [Visitas]
      summary: Agenda uma visita prevista para o participante (RF12, task 3755)
      description: |
        Perfil permitido: COORDENADOR.
        Regras, nesta ordem: participante INCLUIDO (409 `PARTICIPANTE_NAO_INCLUIDO`); estudo não encerrado
        (409 `ESTUDO_ENCERRADO`); visita prevista do mesmo estudo (404); data dentro da janela
        `dataInclusao + diaPrevisto ± janelaDias` (400 `VALIDACAO`, campo `dataHora`); nenhum outro agendamento
        não cancelado da mesma visita prevista (409 `VISITA_JA_AGENDADA`).
      parameters:
        - $ref: "#/components/parameters/CandidatoIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitaEntrada"
      responses:
        "201":
          description: Visita agendada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visita"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/visitas:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Visitas]
      summary: Agenda de visitas do estudo (RF12)
      description: |
        Perfis permitidos: PESQUISADOR, COORDENADOR e ADMINISTRADOR. Ordenada por data e hora.
        `de` e `ate` filtram o período [de, ate).
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/StatusVisita"
        - name: de
          in: query
          schema:
            type: string
            format: date-time
        - name: ate
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Visitas do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Visita"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"

  /visitas/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Visitas]
      summary: Detalha uma visita
      description: "Perfil permitido: COORDENADOR."
      responses:
        "200":
          description: Visita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visita"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
    put:
      tags: [Visitas]
      summary: Reagenda uma visita ainda AGENDADA (RF12, task 3755)
      description: |
        Perfil permitido: COORDENADOR. A nova data também precisa ficar dentro da janela.
        Visita já registrada responde 409 `VISITA_JA_FINALIZADA`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitaReagendamento"
      responses:
        "200":
          description: Visita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visita"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /visitas/{id}/status:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Visitas]
      summary: Registra a visita como realizada, ausente ou cancelada (RF13, task 3758)
      description: |
        Perfil permitido: COORDENADOR. Só sai de AGENDADA, uma vez (409 `VISITA_JA_FINALIZADA`).
        REALIZADA e AUSENTE só depois da data e hora marcadas (409 `VISITA_AINDA_NAO_OCORREU`).
        CANCELADA exige o motivo em `observacao` (400 `VALIDACAO`). Estudo encerrado: 409 `ESTUDO_ENCERRADO`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitaStatusEntrada"
      responses:
        "200":
          description: Visita
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Visita"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /visitas/{id}/resultados:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Resultados]
      summary: Lista as atividades da visita com os resultados (RF14, task 3763)
      description: |
        Perfis permitidos: PESQUISADOR, COORDENADOR e ADMINISTRADOR.
        Traz todas as atividades da visita prevista, na ordem do protocolo. Atividade ainda sem resultado
        vem com `resultado`, `registradoEm` e `registradoPor` nulos. Funciona para visita em qualquer status.
      responses:
        "200":
          description: Atividades da visita e seus resultados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadosVisita"
              example:
                visitaId: 12
                status: REALIZADA
                itens:
                  - atividadeId: 4
                    ordem: 1
                    descricao: Aferir pressão arterial
                    resultado: PA 120x80
                    observacao: null
                    registradoEm: "2026-12-01T10:15:00"
                    registradoPor: Carla Coordenadora
                  - atividadeId: 5
                    ordem: 2
                    descricao: Coletar glicemia em jejum
                    resultado: null
                    observacao: null
                    registradoEm: null
                    registradoPor: null
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Resultados]
      summary: Registra ou altera os resultados das atividades da visita, em lote (RF14, task 3763)
      description: |
        Perfil permitido: COORDENADOR.
        Grava cada item enviado: se a atividade já tem resultado, ele é substituído (upsert), registrando
        quem e quando alterou. Atividades que não vierem na lista ficam como estão.
        Regras, nesta ordem: estudo não encerrado (409 `ESTUDO_ENCERRADO`); visita REALIZADA
        (409 `VISITA_NAO_REALIZADA`); cada atividade da visita prevista desta visita (409 `ATIVIDADE_FORA_DA_VISITA`);
        `resultado` obrigatório, até 500 caracteres (400 `VALIDACAO`). Se um item falhar, nada é gravado.
        Devolve a lista completa, igual ao GET.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResultadosEntrada"
            example:
              itens:
                - atividadeId: 4
                  resultado: PA 120x80
                - atividadeId: 5
                  resultado: Glicemia 92 mg/dL
                  observacao: Participante em jejum de 10 horas
      responses:
        "200":
          description: Resultados gravados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResultadosVisita"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Regra de negócio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              example:
                timestamp: "2026-11-30T15:00:00-03:00"
                status: 409
                codigo: VISITA_NAO_REALIZADA
                mensagem: Só é possível registrar resultados de uma visita realizada

  /candidatos/{candidatoId}/historico:
    parameters:
      - $ref: "#/components/parameters/CandidatoIdPath"
    get:
      tags: [Histórico]
      summary: Histórico de visitas e resultados do participante (RF15, task 3765)
      description: |
        Perfis permitidos: PESQUISADOR, COORDENADOR e ADMINISTRADOR (somente leitura).
        Consulta, sem tabela nova: todas as visitas do participante (agendadas, realizadas, ausentes e canceladas),
        da mais antiga para a mais recente, cada uma com os resultados registrados. Também mostra a retirada,
        se houver. Candidato que nunca foi incluído responde 409 `PARTICIPANTE_NAO_INCLUIDO`.
      responses:
        "200":
          description: Histórico do participante
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Historico"
              example:
                participante:
                  candidatoId: 7
                  nome: João Candidato
                  email: joao.candidato@email.com
                  status: INCLUIDO
                  dataInclusao: "2026-11-20"
                  retirada: null
                estudo:
                  id: 3
                  titulo: Estudo de Controle Glicêmico
                visitas:
                  - id: 12
                    visitaPrevista:
                      id: 2
                      ordem: 1
                      nome: Visita inicial
                    dataHora: "2026-12-01T09:00:00"
                    local: Sala 2
                    status: REALIZADA
                    observacao: null
                    resultados:
                      - atividadeId: 4
                        ordem: 1
                        descricao: Aferir pressão arterial
                        resultado: PA 120x80
                        observacao: null
                        registradoEm: "2026-12-01T10:15:00"
                        registradoPor: Carla Coordenadora
                  - id: 13
                    visitaPrevista:
                      id: 3
                      ordem: 2
                      nome: Retorno de 30 dias
                    dataHora: "2026-12-30T09:00:00"
                    local: null
                    status: AGENDADA
                    observacao: null
                    resultados: []
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /candidatos/{candidatoId}/retirada:
    parameters:
      - $ref: "#/components/parameters/CandidatoIdPath"
    post:
      tags: [Retirada]
      summary: Registra a retirada do participante do estudo (RF16, task 3768)
      description: |
        Perfil permitido: COORDENADOR.
        Na mesma transação: o status vai para RETIRADO, com data, motivo e responsável; as visitas AGENDADAS
        do participante viram CANCELADA com a observação "Retirada do participante" (REALIZADA, AUSENTE e
        CANCELADA não mudam). A vaga é liberada, porque a contagem de vagas considera só INCLUIDO.
        A conta do participante continua ativa: no app, ele segue vendo a participação RETIRADO (RF17).
        Regras, nesta ordem: estudo não encerrado (409 `ESTUDO_ENCERRADO`); participante não retirado antes
        (409 `PARTICIPANTE_JA_RETIRADO`); participante INCLUIDO (409 `PARTICIPANTE_NAO_INCLUIDO`);
        `motivo` obrigatório, até 500 caracteres (400 `VALIDACAO`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RetiradaEntrada"
            example:
              motivo: Participante mudou de cidade e não poderá comparecer às visitas
      responses:
        "200":
          description: Participante retirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Retirada"
              example:
                candidato:
                  id: 7
                  estudoId: 3
                  nome: João Candidato
                  email: joao@exemplo.test
                  telefone: null
                  dataNascimento: "1990-05-20"
                  status: RETIRADO
                  consentimento:
                    registradoEm: "2026-11-19T14:00:00"
                    registradoPor: Carla Coordenadora
                  dataInclusao: "2026-11-20"
                  possuiConta: true
                  retirada:
                    registradaEm: "2026-12-10T16:30:00"
                    registradaPor: Carla Coordenadora
                    motivo: Participante mudou de cidade e não poderá comparecer às visitas
                visitasCanceladas: 2
                vagasOcupadas: 4
                limiteParticipantes: 10
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Regra de negócio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              example:
                timestamp: "2026-12-10T16:30:00-03:00"
                status: 409
                codigo: PARTICIPANTE_JA_RETIRADO
                mensagem: Este participante já foi retirado do estudo

  /participantes/me/estudos:
    get:
      tags: [App do participante]
      summary: Estudos do participante logado (RF17, task 3773)
      description: |
        Perfil permitido: PARTICIPANTE. Usa o usuário do token: nenhum id é informado, e o participante
        só vê as próprias participações. Traz as participações INCLUIDO e RETIRADO, das mais recentes
        para as mais antigas, com a próxima visita agendada de cada uma.
      responses:
        "200":
          description: Participações do usuário logado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EstudoDoParticipante"
              example:
                - id: 3
                  titulo: Estudo de Controle Glicêmico
                  responsavel: Ana Pesquisadora
                  estado: EXECUCAO
                  dataInicio: "2026-11-01"
                  dataFim: "2027-03-31"
                  candidatoId: 7
                  participacao: INCLUIDO
                  dataInclusao: "2026-11-20"
                  retiradaEm: null
                  proximaVisita:
                    id: 13
                    nome: Retorno de 30 dias
                    dataHora: "2026-12-30T09:00:00"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"

  /participantes/me/visitas:
    get:
      tags: [App do participante]
      summary: Visitas do participante logado (RF18, task 3775)
      description: |
        Perfil permitido: PARTICIPANTE. Usa o usuário do token, como `/participantes/me/estudos`.
        Traz as visitas AGENDADA, REALIZADA e AUSENTE de todas as participações, por data e hora.
        As canceladas não aparecem. O app separa as próximas (AGENDADA) do histórico de comparecimento
        (REALIZADA e AUSENTE).
      responses:
        "200":
          description: Visitas do usuário logado
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitaDoParticipante"
              example:
                - id: 12
                  estudoId: 3
                  estudoTitulo: Estudo de Controle Glicêmico
                  nome: Visita inicial
                  dataHora: "2026-12-01T09:00:00"
                  local: Sala 2
                  status: REALIZADA
                - id: 13
                  estudoId: 3
                  estudoTitulo: Estudo de Controle Glicêmico
                  nome: Retorno de 30 dias
                  dataHora: "2026-12-30T09:00:00"
                  local: null
                  status: AGENDADA
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enviar o token no cabeçalho Authorization como "Bearer <token>".

  parameters:
    CandidatoIdPath:
      name: candidatoId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Page:
      name: page
      in: query
      description: Número da página, começando em 0
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Itens por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    RequisicaoInvalida:
      description: Dados inválidos (campo obrigatório ausente, formato errado ou regra de validação)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
          example:
            timestamp: "2026-10-24T18:45:00-03:00"
            status: 400
            codigo: VALIDACAO
            mensagem: Dados inválidos
            detalhes:
              - campo: dataFim
                mensagem: A data de término não pode ser anterior à data de início
    NaoAutenticado:
      description: Token ausente, inválido ou expirado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    SemPermissao:
      description: O perfil do usuário não permite esta ação
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    NaoEncontrado:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"
    Conflito:
      description: Conflito com uma regra de negócio (por exemplo, e-mail já cadastrado ou estudo encerrado)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Erro"

  schemas:
    AtividadeEntrada:
      type: object
      required: [ordem, descricao]
      properties:
        ordem:
          type: integer
          minimum: 1
        descricao:
          type: string
          minLength: 1
          maxLength: 500

    Atividade:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        ordem:
          type: integer
          minimum: 1
        descricao:
          type: string
          maxLength: 500

    VisitaPrevistaEntrada:
      type: object
      required: [ordem, nome, diaPrevisto]
      properties:
        ordem:
          type: integer
          minimum: 1
        nome:
          type: string
          minLength: 3
          maxLength: 120
        diaPrevisto:
          type: integer
          minimum: 0
        janelaDias:
          type: integer
          minimum: 0
          nullable: true
        descricao:
          type: string
          maxLength: 500
          nullable: true
        atividades:
          type: array
          items:
            $ref: "#/components/schemas/AtividadeEntrada"

    VisitaPrevista:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        ordem:
          type: integer
          minimum: 1
        nome:
          type: string
          maxLength: 120
        diaPrevisto:
          type: integer
          minimum: 0
        janelaDias:
          type: integer
          minimum: 0
          nullable: true
        descricao:
          type: string
          maxLength: 500
          nullable: true
        atividades:
          type: array
          items:
            $ref: "#/components/schemas/Atividade"

    TipoCriterio:
      type: string
      enum: [INCLUSAO, EXCLUSAO]

    CriterioEntrada:
      type: object
      required: [tipo, descricao]
      additionalProperties: false
      properties:
        tipo:
          $ref: "#/components/schemas/TipoCriterio"
        descricao:
          type: string
          minLength: 3
          maxLength: 500
        ordem:
          type: integer
          minimum: 1
          nullable: true
          description: Quando omitida, o critério vai para o fim da lista do tipo.

    Criterio:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        tipo:
          $ref: "#/components/schemas/TipoCriterio"
        descricao:
          type: string
          minLength: 3
          maxLength: 500
        ordem:
          type: integer
          minimum: 1

    StatusCandidato:
      type: string
      enum: [CADASTRADO, ELEGIVEL, INELEGIVEL, INCLUIDO, RETIRADO]

    CandidatoEntrada:
      type: object
      required: [nome, email, dataNascimento]
      additionalProperties: false
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 255
        telefone:
          type: string
          minLength: 8
          maxLength: 20
          nullable: true
          description: Aceita dígitos, espaços, parênteses, + e -.
        dataNascimento:
          type: string
          format: date

    ConsentimentoCandidato:
      type: object
      nullable: true
      properties:
        registradoEm:
          type: string
          format: date-time
        registradoPor:
          type: string

    Candidato:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        estudoId:
          type: integer
          format: int64
        nome:
          type: string
        email:
          type: string
          format: email
        telefone:
          type: string
          nullable: true
        dataNascimento:
          type: string
          format: date
        status:
          $ref: "#/components/schemas/StatusCandidato"
        consentimento:
          $ref: "#/components/schemas/ConsentimentoCandidato"
        dataInclusao:
          type: string
          format: date
          nullable: true
        possuiConta:
          type: boolean
          description: Verdadeiro quando o participante já tem conta de acesso ao app (task 3751)
        retirada:
          $ref: "#/components/schemas/RetiradaCandidato"

    RetiradaCandidato:
      type: object
      nullable: true
      description: Preenchida só quando o status é RETIRADO (RF16, task 3768)
      properties:
        registradaEm:
          type: string
          format: date-time
        registradaPor:
          type: string
        motivo:
          type: string

    AvaliacaoRespostaEntrada:
      type: object
      required: [criterioId, atende]
      additionalProperties: false
      properties:
        criterioId:
          type: integer
          format: int64
        atende:
          type: boolean
        observacao:
          type: string
          maxLength: 500
          nullable: true

    AvaliacaoEntrada:
      type: object
      required: [respostas]
      additionalProperties: false
      properties:
        respostas:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/AvaliacaoRespostaEntrada"

    Avaliador:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string

    AvaliacaoItem:
      type: object
      properties:
        criterioId:
          type: integer
          format: int64
        tipo:
          $ref: "#/components/schemas/TipoCriterio"
        descricao:
          type: string
        ordem:
          type: integer
        atende:
          type: boolean
          nullable: true
        observacao:
          type: string
          nullable: true

    Avaliacao:
      type: object
      properties:
        candidatoId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/StatusCandidato"
        avaliadoEm:
          type: string
          format: date-time
          nullable: true
        avaliadoPor:
          $ref: "#/components/schemas/Avaliador"
        criterios:
          type: array
          items:
            $ref: "#/components/schemas/AvaliacaoItem"

    Inclusao:
      type: object
      required: [vagasOcupadas, limiteParticipantes, conta]
      properties:
        vagasOcupadas:
          type: integer
          format: int64
        limiteParticipantes:
          type: integer
        conta:
          $ref: "#/components/schemas/ContaParticipante"

    StatusVisita:
      type: string
      enum: [AGENDADA, REALIZADA, AUSENTE, CANCELADA]

    VisitaEntrada:
      type: object
      required: [visitaPrevistaId, dataHora]
      properties:
        visitaPrevistaId:
          type: integer
          format: int64
        dataHora:
          type: string
          format: date-time
          example: "2026-12-01T09:00:00"
        local:
          type: string
          maxLength: 120
          nullable: true

    VisitaReagendamento:
      type: object
      required: [dataHora]
      properties:
        dataHora:
          type: string
          format: date-time
        local:
          type: string
          maxLength: 120
          nullable: true

    VisitaStatusEntrada:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [REALIZADA, AUSENTE, CANCELADA]
        observacao:
          type: string
          maxLength: 500
          nullable: true
          description: Obrigatória no cancelamento (motivo)

    Visita:
      type: object
      properties:
        id:
          type: integer
          format: int64
        estudoId:
          type: integer
          format: int64
        participante:
          type: object
          properties:
            candidatoId:
              type: integer
              format: int64
            nome:
              type: string
        visitaPrevista:
          type: object
          properties:
            id:
              type: integer
              format: int64
            ordem:
              type: integer
            nome:
              type: string
        dataHora:
          type: string
          format: date-time
        local:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/StatusVisita"
        observacao:
          type: string
          nullable: true
        janela:
          type: object
          nullable: true
          description: Datas permitidas para a visita (dataInclusao + diaPrevisto ± janelaDias)
          properties:
            inicio:
              type: string
              format: date
            fim:
              type: string
              format: date
        agendadaPor:
          type: string
        statusRegistradoEm:
          type: string
          format: date-time
          nullable: true
        statusRegistradoPor:
          type: string
          nullable: true

    ContaParticipante:
      type: object
      required: [usuarioId, email, ativo, contaExistente]
      properties:
        usuarioId:
          type: integer
          format: int64
        email:
          type: string
          format: email
          description: E-mail de acesso ao app (o mesmo do candidato, em minúsculas)
        ativo:
          type: boolean
        contaExistente:
          type: boolean
          description: Verdadeiro quando a conta já existia antes desta operação
        senhaProvisoria:
          type: string
          nullable: true
          description: |
            Preenchida só quando a senha acabou de ser gerada (conta nova ou nova senha provisória).
            Não é guardada em texto e não aparece de novo; o coordenador entrega ao participante.

    ResultadoItemEntrada:
      type: object
      required: [atividadeId, resultado]
      additionalProperties: false
      properties:
        atividadeId:
          type: integer
          format: int64
        resultado:
          type: string
          minLength: 1
          maxLength: 500
          description: Valor fictício (por exemplo, "PA 120x80")
        observacao:
          type: string
          maxLength: 500
          nullable: true

    ResultadosEntrada:
      type: object
      required: [itens]
      additionalProperties: false
      properties:
        itens:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/ResultadoItemEntrada"

    ResultadoAtividade:
      type: object
      description: Uma atividade da visita prevista, com o resultado registrado ou nulo
      properties:
        atividadeId:
          type: integer
          format: int64
        ordem:
          type: integer
        descricao:
          type: string
        resultado:
          type: string
          nullable: true
        observacao:
          type: string
          nullable: true
        registradoEm:
          type: string
          format: date-time
          nullable: true
        registradoPor:
          type: string
          nullable: true

    ResultadosVisita:
      type: object
      properties:
        visitaId:
          type: integer
          format: int64
        status:
          $ref: "#/components/schemas/StatusVisita"
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ResultadoAtividade"

    HistoricoVisita:
      type: object
      properties:
        id:
          type: integer
          format: int64
        visitaPrevista:
          type: object
          properties:
            id:
              type: integer
              format: int64
            ordem:
              type: integer
            nome:
              type: string
        dataHora:
          type: string
          format: date-time
        local:
          type: string
          nullable: true
        status:
          $ref: "#/components/schemas/StatusVisita"
        observacao:
          type: string
          nullable: true
          description: Motivo do cancelamento ou anotação
        resultados:
          type: array
          description: Só as atividades com resultado registrado (vazio se a visita não foi realizada)
          items:
            $ref: "#/components/schemas/ResultadoAtividade"

    Historico:
      type: object
      properties:
        participante:
          type: object
          properties:
            candidatoId:
              type: integer
              format: int64
            nome:
              type: string
            email:
              type: string
              format: email
            status:
              $ref: "#/components/schemas/StatusCandidato"
            dataInclusao:
              type: string
              format: date
            retirada:
              $ref: "#/components/schemas/RetiradaCandidato"
        estudo:
          type: object
          properties:
            id:
              type: integer
              format: int64
            titulo:
              type: string
        visitas:
          type: array
          description: Da mais antiga para a mais recente
          items:
            $ref: "#/components/schemas/HistoricoVisita"

    RetiradaEntrada:
      type: object
      required: [motivo]
      additionalProperties: false
      properties:
        motivo:
          type: string
          minLength: 1
          maxLength: 500

    Retirada:
      type: object
      properties:
        candidato:
          $ref: "#/components/schemas/Candidato"
        visitasCanceladas:
          type: integer
          description: Quantas visitas AGENDADAS foram canceladas pela retirada
        vagasOcupadas:
          type: integer
          format: int64
          description: Vagas ocupadas depois da retirada
        limiteParticipantes:
          type: integer

    EstudoDoParticipante:
      type: object
      description: Uma participação do usuário logado (RF17)
      properties:
        id:
          type: integer
          format: int64
          description: Id do estudo
        titulo:
          type: string
        responsavel:
          type: string
          description: Nome do pesquisador responsável
        estado:
          $ref: "#/components/schemas/EstadoEstudo"
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
          nullable: true
        candidatoId:
          type: integer
          format: int64
        participacao:
          type: string
          enum: [INCLUIDO, RETIRADO]
        dataInclusao:
          type: string
          format: date
        retiradaEm:
          type: string
          format: date-time
          nullable: true
        proximaVisita:
          type: object
          nullable: true
          description: Próxima visita AGENDADA desta participação
          properties:
            id:
              type: integer
              format: int64
            nome:
              type: string
            dataHora:
              type: string
              format: date-time

    VisitaDoParticipante:
      type: object
      description: Uma visita do usuário logado (RF18)
      properties:
        id:
          type: integer
          format: int64
        estudoId:
          type: integer
          format: int64
        estudoTitulo:
          type: string
        nome:
          type: string
          description: Nome da visita prevista
        dataHora:
          type: string
          format: date-time
        local:
          type: string
          nullable: true
        status:
          type: string
          enum: [AGENDADA, REALIZADA, AUSENTE]

    PerfilTipo:
      type: string
      enum: [ADMINISTRADOR, PESQUISADOR, COORDENADOR, PARTICIPANTE]

    EstadoEstudo:
      type: string
      enum: [PLANEJAMENTO, RECRUTAMENTO, EXECUCAO, ENCERRADO]

    EstudoEstadoEntrada:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          $ref: "#/components/schemas/EstadoEstudo"

    LoginRequest:
      type: object
      required: [email, senha]
      properties:
        email:
          type: string
          format: email
          example: ana.pesquisadora@clinicalstudypb.test
        senha:
          type: string
          format: password

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        tipo:
          type: string
          example: Bearer
        expiraEm:
          type: string
          format: date-time
        usuario:
          $ref: "#/components/schemas/UsuarioLogado"

    Usuario:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        nome:
          type: string
          example: Ana Souza
        email:
          type: string
          format: email
          example: ana.pesquisadora@clinicalstudypb.test
        matricula:
          type: string
          nullable: true
        perfil:
          $ref: "#/components/schemas/PerfilTipo"
        ativo:
          type: boolean

    UsuarioLogado:
      allOf:
        - $ref: "#/components/schemas/Usuario"
        - type: object
          properties:
            permissoes:
              type: array
              items:
                type: string
              example: [ESTUDO_CRIAR, ESTUDO_CONSULTAR]

    UsuarioCriacao:
      type: object
      required: [nome, email, perfil, senha]
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
        matricula:
          type: string
          nullable: true
        perfil:
          $ref: "#/components/schemas/PerfilTipo"
        senha:
          type: string
          format: password
          minLength: 8
          writeOnly: true

    UsuarioAtualizacao:
      type: object
      required: [nome, email, perfil]
      properties:
        nome:
          type: string
          minLength: 3
          maxLength: 120
        email:
          type: string
          format: email
        matricula:
          type: string
          nullable: true
        perfil:
          $ref: "#/components/schemas/PerfilTipo"

    PerfilDetalhe:
      type: object
      properties:
        perfil:
          $ref: "#/components/schemas/PerfilTipo"
        permissoes:
          type: array
          items:
            type: string

    ResponsavelResumo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        nome:
          type: string

    EstudoEntrada:
      type: object
      required: [titulo, objetivo, responsavelId, dataInicio, limiteParticipantes]
      properties:
        titulo:
          type: string
          minLength: 3
          maxLength: 200
        objetivo:
          type: string
          maxLength: 2000
        responsavelId:
          type: integer
          format: int64
          description: Id de um usuário ativo com perfil PESQUISADOR
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
          nullable: true
        limiteParticipantes:
          type: integer
          minimum: 1

    Estudo:
      type: object
      properties:
        id:
          type: integer
          format: int64
          readOnly: true
        titulo:
          type: string
        objetivo:
          type: string
        responsavel:
          $ref: "#/components/schemas/ResponsavelResumo"
        dataInicio:
          type: string
          format: date
        dataFim:
          type: string
          format: date
          nullable: true
        limiteParticipantes:
          type: integer
        estado:
          $ref: "#/components/schemas/EstadoEstudo"

    Pagina:
      type: object
      properties:
        number:
          type: integer
          description: Página atual (começa em 0)
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer

    PaginaUsuarios:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Usuario"

    PaginaEstudos:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Estudo"

    PaginaCandidatos:
      allOf:
        - $ref: "#/components/schemas/Pagina"
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: "#/components/schemas/Candidato"

    Erro:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 404
        codigo:
          type: string
          description: Código curto para o front tratar. A lista completa está na descrição do contrato (info).
        mensagem:
          type: string
        detalhes:
          type: array
