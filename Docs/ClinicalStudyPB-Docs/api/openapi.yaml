openapi: 3.0.3

info:
  title: ClinicalStudyPB API
  version: 0.1.0
  description: |
    Contrato da API REST do ClinicalStudyPB, compartilhada pela aplicação web e pelo aplicativo mobile.

    **Escopo:** RF01 a RF18. As rotas de RF14 a RF18 (resultados, histórico, retirada e app do participante)
    são o contrato da Sprint 3 (task 3749): a web e o mobile podem montar as telas antes de o backend ficar pronto.
    O modelo de dados está no `MER-v3.md`.

    **Autenticação:** token JWT no cabeçalho `Authorization: Bearer <token>`, obtido em `POST /auth/login`.
    Cada usuário tem um único perfil, e cada rota informa os perfis permitidos (os demais recebem 403).

    **Erros:** todos usam o schema `Erro`. O campo `codigo` é estável e é o que a web e o mobile devem tratar:

    | Status | Código | Quando |
    | --- | --- | --- |
    | 400 | `VALIDACAO` | Campo obrigatório ausente, formato errado ou fora do limite (o campo vem em `detalhes`) |
    | 401 | `NAO_AUTENTICADO`, `CREDENCIAIS_INVALIDAS`, `USUARIO_INATIVO` | Sem token, token inválido, login errado ou usuário desativado |
    | 403 | `SEM_PERMISSAO` | O perfil não pode usar a rota |
    | 404 | `NAO_ENCONTRADO` | O recurso não existe |
    | 409 | `EMAIL_DUPLICADO` | E-mail de usuário já cadastrado (RF01) |
    | 409 | `USUARIO_PROPRIO_DESATIVACAO` | Administrador tenta desativar o próprio usuário (RF01) |
    | 409 | `TRANSICAO_ESTADO_INVALIDA` | Mudança de estado do estudo não permitida (RF07) |
    | 409 | `ESTUDO_FORA_DO_PLANEJAMENTO` | Critério alterado fora do planejamento (RF05) |
    | 409 | `ESTUDO_FORA_DE_RECRUTAMENTO` | Candidato ou avaliação fora do recrutamento (RF08, RF09) |
    | 409 | `ESTUDO_ENCERRADO` | Operação em estudo encerrado (RF08 a RF16) |
    | 409 | `ORDEM_DUPLICADA` | Ordem de critério ou visita prevista repetida (RF05, RF06) |
    | 409 | `CRITERIO_EM_USO` | Critério já usado em avaliação (RF05) |
    | 409 | `VISITA_PREVISTA_COM_AGENDAMENTOS` | Visita prevista com visitas agendadas não pode ser excluída (RF06) |
    | 409 | `VISITA_PREVISTA_COM_RESULTADOS` | Visita prevista com resultados registrados não pode ser editada (RF06, RF14, novo) |
    | 409 | `EMAIL_DUPLICADO_NO_ESTUDO`, `EMAIL_COM_CONTA` | E-mail repetido no estudo ou de alguém da equipe (RF08) |
    | 409 | `ESTUDO_SEM_CRITERIOS_DE_INCLUSAO`, `CANDIDATO_JA_INCLUIDO`, `CANDIDATO_COM_CONSENTIMENTO` | Avaliação não permitida (RF09) |
    | 409 | `CANDIDATO_NAO_ELEGIVEL`, `CONSENTIMENTO_JA_REGISTRADO` | Consentimento não permitido (RF10) |
    | 409 | `CONSENTIMENTO_NAO_REGISTRADO`, `VAGAS_ESGOTADAS`, `EMAIL_DE_OUTRO_PERFIL` | Inclusão não permitida (RF11) |
    | 409 | `PARTICIPANTE_NAO_INCLUIDO` | Visita, resultado ou retirada de quem não está INCLUIDO (RF12, RF16) |
    | 409 | `VISITA_JA_AGENDADA` | Já existe agendamento ativo da mesma visita prevista (RF12) |
    | 409 | `VISITA_JA_FINALIZADA` | Visita que já saiu de AGENDADA (RF12, RF13) |
    | 409 | `VISITA_AINDA_NAO_OCORREU` | Realizada ou ausente antes da data marcada (RF13) |
    | 409 | `VISITA_NAO_REALIZADA` | Resultado em visita que não está REALIZADA (RF14, novo) |
    | 409 | `ATIVIDADE_FORA_DA_VISITA` | Atividade que não pertence à visita prevista da visita (RF14, novo) |
    | 409 | `PARTICIPANTE_JA_RETIRADO` | Retirada de quem já foi retirado (RF16, novo) |

    Todos os dados são fictícios.

servers:
  - url: http://localhost:8080/api
    description: Desenvolvimento local

tags:
  - name: Autenticação
    description: Login, logout e dados do usuário logado (RF02, RF03)
  - name: Usuários
    description: Cadastro e gestão de usuários (RF01). Somente administrador.
  - name: Perfis
    description: Perfis de acesso e suas permissões (RF03)
  - name: Estudos
    description: Cadastro de estudos (RF04)
  - name: Critérios
    description: Critérios de elegibilidade dos estudos (RF05)
  - name: Candidatos
    description: Candidatos vinculados aos estudos (RF08)
  - name: Avaliação de elegibilidade
    description: Avaliação dos critérios de elegibilidade dos candidatos (RF09)
  - name: Consentimento
    description: Registro do consentimento simulado dos candidatos (RF10)
  - name: Inclusão
    description: Inclusão de candidatos nos estudos (RF11)
  - name: Visitas
    description: Agendamento e status das visitas dos participantes (RF12, RF13; tasks 3755 e 3758)
  - name: Conta do participante
    description: Acesso do participante incluído ao app (task 3751, RF02/RF17/RF18)
  - name: Resultados
    description: Resultados fictícios das atividades de uma visita realizada (RF14, task 3763)
  - name: Histórico
    description: Visitas e resultados do participante, por data (RF15, task 3765)
  - name: Retirada
    description: Retirada do participante do estudo (RF16, task 3768)
  - name: App do participante
    description: Estudos e visitas do participante logado (RF17 e RF18, tasks 3773 e 3775). Somente PARTICIPANTE.

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Autenticação]
      summary: Autentica o usuário (RF02)
      description: Público. Retorna o token e os dados do usuário. Usuário inativo não consegue entrar.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          description: E-mail ou senha incorretos, ou usuário inativo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /auth/logout:
    post:
      tags: [Autenticação]
      summary: Encerra a sessão (RF02)
      description: |
        Qualquer perfil autenticado. Com JWT, o encerramento principal é o cliente descartar o token;
        o backend pode invalidá-lo (lista de tokens revogados) se a equipe decidir.
      responses:
        "204":
          description: Sessão encerrada
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /auth/me:
    get:
      tags: [Autenticação]
      summary: Dados do usuário logado e suas permissões (RF03)
      description: Qualquer perfil autenticado. A web e o mobile usam para decidir o que exibir.
      responses:
        "200":
          description: Usuário logado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsuarioLogado"
        "401":
          $ref: "#/components/responses/NaoAutenticado"

  /usuarios:
    get:
      tags: [Usuários]
      summary: Lista usuários (RF01)
      description: "Perfil permitido: ADMINISTRADOR."
      parameters:
        - name: perfil
          in: query
          schema:
            $ref: "#/components/schemas/PerfilTipo"
        - name: ativo
          in: query
          schema:
            type: boolean
        - name: busca
          in: query
          description: Texto a procurar no nome ou no e-mail
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaUsuarios"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
    post:
      tags: [Usuários]
      summary: Cadastra um usuário (RF01)
      description: "Perfil permitido: ADMINISTRADOR. O e-mail deve ser único."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioCriacao"
      responses:
        "201":
          description: Usuário criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "409":
          $ref: "#/components/responses/Conflito"

  /usuarios/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Usuários]
      summary: Busca um usuário (RF01)
      description: "Perfil permitido: ADMINISTRADOR."
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Usuários]
      summary: Atualiza os dados de um usuário (RF01)
      description: |
        Perfil permitido: ADMINISTRADOR. Não altera senha nem situação (ativo);
        para isso há rotas próprias.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsuarioAtualizacao"
      responses:
        "200":
          description: Usuário atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /usuarios/{id}/status:
    patch:
      tags: [Usuários]
      summary: Ativa ou desativa um usuário (RF01)
      description: |
        Perfil permitido: ADMINISTRADOR. Usuário desativado não faz login.
        Não é permitido desativar o próprio usuário (409 `USUARIO_PROPRIO_DESATIVACAO`).
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ativo]
              properties:
                ativo:
                  type: boolean
      responses:
        "200":
          description: Situação atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Usuario"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Tentativa de desativar o próprio usuário
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"
              example:
                timestamp: "2026-11-23T12:00:00-03:00"
                status: 409
                codigo: USUARIO_PROPRIO_DESATIVACAO
                mensagem: Você não pode desativar o próprio usuário.

  /perfis:
    get:
      tags: [Perfis]
      summary: Lista os perfis e suas permissões (RF03)
      description: "Perfil permitido: ADMINISTRADOR. Usado para preencher a escolha de perfil no cadastro de usuário."
      responses:
        "200":
          description: Perfis disponíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PerfilDetalhe"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"

  /estudos:
    get:
      tags: [Estudos]
      summary: Lista estudos (RF04)
      description: |
        Perfis permitidos: PESQUISADOR, COORDENADOR, ADMINISTRADOR.
        O participante consulta seus estudos por uma rota própria do app (RF17, próxima sprint).
      parameters:
        - name: estado
          in: query
          schema:
            $ref: "#/components/schemas/EstadoEstudo"
        - name: busca
          in: query
          description: Texto a procurar no título
          schema:
            type: string
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
      responses:
        "200":
          description: Página de estudos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaEstudos"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
    post:
      tags: [Estudos]
      summary: Cadastra um estudo (RF04)
      description: |
        Perfil permitido: PESQUISADOR.
        O estudo nasce no estado PLANEJAMENTO. O responsável deve ser um usuário ativo com perfil PESQUISADOR.
        A data de término não pode ser anterior à de início.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstudoEntrada"
      responses:
        "201":
          description: Estudo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"

  /estudos/{id}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Estudos]
      summary: Busca um estudo (RF04)
      description: "Perfis permitidos: PESQUISADOR, COORDENADOR, ADMINISTRADOR."
      responses:
        "200":
          description: Estudo encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    put:
      tags: [Estudos]
      summary: Atualiza os dados de um estudo (RF04)
      description: |
        Perfil permitido: PESQUISADOR. Não altera o estado do estudo (a rota de mudança de estado
        entra com o RF07). Estudo ENCERRADO não pode ser editado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstudoEntrada"
      responses:
        "200":
          description: Estudo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/estado:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    patch:
      tags: [Estudos]
      summary: Altera o estado do estudo (RF07)
      description: |
        Perfil permitido: PESQUISADOR.
        Transições válidas: PLANEJAMENTO → RECRUTAMENTO;
        RECRUTAMENTO → PLANEJAMENTO ou EXECUCAO;
        EXECUCAO → ENCERRADO. ENCERRADO não possui transição de saída.
        Permanecer no mesmo estado é inválido.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EstudoEstadoEntrada"
      responses:
        "200":
          description: Estado alterado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Estudo"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          description: Transição inválida ou estado final
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Erro"

  /estudos/{id}/visitas-previstas:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Visitas previstas]
      summary: Lista visitas previstas e atividades de um estudo (RF06)
      description: Perfis permitidos PESQUISADOR, COORDENADOR e ADMINISTRADOR (o coordenador agenda as visitas a partir desta lista, RF12). Cadastrar, editar e excluir continuam só com o PESQUISADOR.
      responses:
        "200":
          description: Visitas previstas do estudo
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VisitaPrevista"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      tags: [Visitas previstas]
      summary: Cadastra uma visita prevista (RF06)
      description: Perfil permitido PESQUISADOR. A ordem da visita é única no estudo e a ordem das atividades é única na visita.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitaPrevistaEntrada"
      responses:
        "201":
          description: Visita prevista criada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitaPrevista"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/visitas-previstas/{visitaId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: visitaId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Visitas previstas]
      summary: Atualiza uma visita prevista e substitui suas atividades (RF06)
      description: |
        Perfil permitido PESQUISADOR. A edição apaga e recria as atividades; por isso, a visita prevista que
        já tem resultados registrados (RF14) não pode ser editada (409 `VISITA_PREVISTA_COM_RESULTADOS`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitaPrevistaEntrada"
      responses:
        "200":
          description: Visita prevista atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitaPrevista"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
    delete:
      tags: [Visitas previstas]
      summary: Exclui uma visita prevista (RF06)
      description: Perfil permitido PESQUISADOR. As atividades são excluídas em cascata.
      responses:
        "204":
          description: Visita prevista excluída
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/criterios:
    parameters:
      - $ref: "#/components/parameters/IdPath"
    get:
      tags: [Critérios]
      summary: Lista os critérios de um estudo (RF05)
      description: "Perfis permitidos: PESQUISADOR, COORDENADOR, ADMINISTRADOR."
      responses:
        "200":
          description: Critérios do estudo, ordenados por tipo e ordem
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Criterio"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
    post:
      tags: [Critérios]
      summary: Cadastra um critério de elegibilidade (RF05)
      description: |
        Perfil permitido: PESQUISADOR.
        O estudo deve estar em PLANEJAMENTO. A ordem pode ser informada ou é calculada automaticamente.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterioEntrada"
      responses:
        "201":
          description: Critério criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Criterio"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"

  /estudos/{id}/criterios/{criterioId}:
    parameters:
      - $ref: "#/components/parameters/IdPath"
      - name: criterioId
        in: path
        required: true
        schema:
          type: integer
          format: int64
    put:
      tags: [Critérios]
      summary: Atualiza um critério de elegibilidade (RF05)
      description: Perfil permitido PESQUISADOR. O estudo deve estar em PLANEJAMENTO.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriterioEntrada"
      responses:
        "200":
          description: Critério atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Criterio"
        "400":
          $ref: "#/components/responses/RequisicaoInvalida"
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
          $ref: "#/components/responses/Conflito"
    delete:
      tags: [Critérios]
      summary: Remove um critério de elegibilidade (RF05)
      description: |
        Perfil permitido PESQUISADOR.
        O estudo deve estar em PLANEJAMENTO e o critério não pode ter sido usado em avaliações.
      responses:
        "204":
          description: Critério removido
        "401":
          $ref: "#/components/responses/NaoAutenticado"
        "403":
          $ref: "#/components/responses/SemPermissao"
        "404":
          $ref: "#/components/responses/NaoEncontrado"
        "409":
