spring.application.name=clinicalstudypb-api

# Todas as rotas ficam em /api (o nginx e o Vite repassam /api/... sem remover o prefixo)
server.servlet.context-path=/api

# Valores de desenvolvimento local (fictícios). No Docker, as variáveis
# SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME e SPRING_DATASOURCE_PASSWORD substituem estes valores.
spring.datasource.url=jdbc:postgresql://localhost:5432/clinicalstudy
spring.datasource.username=clinical
spring.datasource.password=clinical_dev

# Quem cria as tabelas é o Flyway (src/main/resources/db/migration); o Hibernate só confere
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Autenticação por JWT (RF02). O segredo precisa ter pelo menos 32 caracteres;
# em outro ambiente, defina JWT_SECRET. O valor abaixo é só para desenvolvimento.
clinicalstudypb.jwt.segredo=${JWT_SECRET:clinicalstudypb-segredo-de-desenvolvimento-nao-usar-em-producao}
clinicalstudypb.jwt.expiracao=${JWT_EXPIRACAO:8h}
